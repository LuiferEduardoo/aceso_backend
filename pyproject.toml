[project]
name = "aceso"
version = "0.1.0"
description = "Sports & health backend: gym tracking, health metrics and running with Strava"
readme = "CLAUDE.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncer>=0.0.18",
    "asyncpg>=0.32.0",
    "cryptography>=50.0.2",
    "fastapi[standard]>=0.142.2",
    "garminconnect>=0.3.17",
    "httpx>=0.28.1",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aceso"]

[tool.fastapi]
entrypoint = "aceso.main:app"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".agents"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "ASYNC", "FAST", "RUF"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["aceso"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]
