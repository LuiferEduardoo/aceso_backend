services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: aceso
      POSTGRES_PASSWORD: aceso
      POSTGRES_DB: aceso
    ports:
      - "${POSTGRES_PORT:-5442}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aceso -d aceso"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
